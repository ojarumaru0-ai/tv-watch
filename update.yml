name: update-data

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 日本時間 6:00
  workflow_dispatch:        # 手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect headlines
        run: python update.py
      - name: Commit if changed
        run: |
          git config user.name "tv-watch-bot"
          git config user.email "tv-watch-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
